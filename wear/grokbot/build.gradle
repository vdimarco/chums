apply plugin: 'com.android.application'
apply from: '../provider.gradle'
android {
    defaultConfig {
        applicationId 'club.chums.wear.grokbot'
        buildConfigField 'String', 'FIXED_AGENT', '\"stretch\"'
        buildConfigField 'String', 'APP_TITLE', '\"Grokbot\"'
        manifestPlaceholders = [appLabel: 'Grokbot', appIcon: '@mipmap/provider_launcher']
    }
    sourceSets {
        main {
            manifest.srcFile '../app/src/main/AndroidManifest.xml'
            java.srcDirs = ['../app/src/main/java']
            res.srcDirs = ['../app/src/main/res', 'src/main/res']
            assets.srcDirs = ['../app/src/main/assets']
        }
        debug {
            manifest.srcFile '../app/src/debug/AndroidManifest.xml'
            res.srcDirs = ['../app/src/debug/res']
        }
        test.java.srcDirs = ['../app/src/test/java']
    }
}
